<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>インタビュー：裂け目を縫う調整弁として（後編） | 優 You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-color: #fcfbf9;
            --text-main: #242424;
            --text-sub: #5a5550;
            --accent-color: #8c7b6e;
            --band-bg: #e6e0d5;
            --light-gray: #e8e6e1;
            --pastel-rose: #f4d4d0;
            --pastel-sage: #d9e8e0;
            --pastel-lavender: #e8dfe8;
            --pastel-peach: #f5e0d3;
            --font-serif: 'Noto Serif JP', serif;
            --font-en: 'Cormorant Garamond', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-serif);
            color: var(--text-main);
            background-color: var(--bg-color);
            line-height: 2;
            letter-spacing: 0.05em;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: rgba(252, 251, 249, 0.95);
            backdrop-filter: blur(8px);
            padding: 2rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(232, 230, 225, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 1rem; letter-spacing: 0.2em; font-weight: 300; }
        header h1 a { color: var(--text-main); text-decoration: none; transition: opacity 0.3s; }
        header h1 a:hover { opacity: 0.6; }
        nav a { color: var(--text-main); text-decoration: none; font-size: 0.8rem; font-family: var(--font-en); letter-spacing: 0.15em; transition: opacity 0.3s; margin-left: 1.2em; }
        nav a:hover { opacity: 0.6; }

        .interview-container { max-width: 820px; margin: 0 auto; padding: 80px 30px 60px; }
        .interview-header { margin-bottom: 80px; text-align: center; border-bottom: 1px solid var(--light-gray); padding-bottom: 60px; }
        .interview-eyebrow { font-size: 0.85rem; color: var(--accent-color); letter-spacing: 0.25em; text-transform: uppercase; font-family: var(--font-en); margin-bottom: 20px; font-weight: 400; }
        .interview-header h1 { font-size: 2.2rem; font-weight: 300; margin-bottom: 25px; line-height: 1.6; letter-spacing: 0.08em; }
        .interview-lead { font-size: 1rem; color: var(--text-sub); line-height: 2; max-width: 700px; margin: 0 auto 40px; font-weight: 300; }
        .interview-meta { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-sub); font-family: var(--font-en); letter-spacing: 0.1em; }
        .meta-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .meta-label { color: var(--accent-color); font-weight: 400; }

        .interviewer-info { background-color: var(--pastel-rose); padding: 40px 30px; margin: 60px 0; border-left: 3px solid var(--accent-color); border-radius: 4px; }
        .interviewer-info p { margin-bottom: 10px; }
        .interviewer-info p:last-child { margin-bottom: 0; }

        .interview-section { margin: 80px 0; padding: 50px 0; border-bottom: 1px solid var(--light-gray); }
        .interview-section:last-of-type { border-bottom: none; }
        .section-title { font-size: 1.5rem; font-weight: 400; margin-bottom: 10px; letter-spacing: 0.1em; color: var(--text-main); }
        .section-number { color: var(--accent-color); font-size: 0.9rem; font-family: var(--font-en); letter-spacing: 0.15em; display: block; margin-bottom: 5px; }

        .qa-block { margin: 40px 0; }
        .question { background-color: var(--pastel-sage); padding: 25px 30px; margin-bottom: 25px; border-left: 4px solid var(--accent-color); border-radius: 2px; font-size: 0.98rem; line-height: 1.9; }
        .question::before { content: ''; }

        .answer { padding: 0 20px; font-size: 0.97rem; line-height: 2.1; text-align: justify; }
        .answer p { margin-bottom: 20px; }
        .answer p:last-child { margin-bottom: 0; }
        .answer::before { content: ''; }

        .pullquote { border-left: 4px solid var(--accent-color); padding: 30px; margin: 50px 0; background-color: var(--pastel-lavender); font-size: 1.05rem; font-weight: 400; line-height: 2.1; text-align: center; }

        strong { color: var(--text-main); font-weight: 600; }
        u { text-decoration: underline; text-decoration-color: var(--accent-color); text-underline-offset: 3px; }

        .table-of-contents {
            background-color: #f8f6f1;
            padding: 30px 40px;
            margin: 40px 0 60px;
            border-radius: 8px;
            border: 1px solid var(--light-gray);
        }
        .table-of-contents h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            letter-spacing: 0.1em;
            color: var(--accent-color);
        }
        .table-of-contents ul { list-style: none; }
        .table-of-contents li { margin-bottom: 8px; }
        .table-of-contents a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            transition: opacity 0.3s;
        }
        .table-of-contents a:hover { opacity: 0.6; }

        /* ===== 写真スタイル（前編・中編と同じ） ===== */
        .header-photo-container {
            width: 100%;
            max-width: 580px;
            margin: 20px auto 35px;
            padding: 8px;
            background-color: #ffffff;
            border: 1px solid #e8e6e1;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            box-sizing: border-box;
        }

        .header-photo {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            object-position: center 25%;
            display: block;
            border-radius: 2px;
            filter: sepia(16%) saturate(88%) contrast(92%) brightness(97%);
        }

        .interview-photo-container {
            margin: 45px auto;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .interview-photo {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            object-position: center 20%;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(140, 123, 110, 0.1);
            display: block;
            margin: 0 auto;
            filter: sepia(25%) saturate(85%) contrast(90%) brightness(96%);
        }

        footer { background-color: var(--band-bg); padding: 60px 30px; text-align: center; border-top: 1px solid var(--light-gray); margin-top: 100px; border-radius: 16px 16px 0 0; }
        .footer-meta { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 20px; font-family: var(--font-en); letter-spacing: 0.1em; }
        .back-link { display: inline-block; color: var(--accent-color); text-decoration: none; font-size: 0.9rem; margin-top: 20px; transition: opacity 0.3s; }
        .back-link:hover { opacity: 0.6; }

        .pastel-container {
            background-color: #f4f0ea;
            border-radius: 16px;
            padding: 30px;
            color: #2b2b2b;
            line-height: 1.85;
            max-width: 750px;
            margin: 0 auto 40px;
        }
        .pastel-header {
            background: linear-gradient(135deg, #e8f0fe 0%, #fce8e6 100%);
            border-radius: 12px;
            padding: 25px 20px;
            margin-bottom: 25px;
            border-left: 6px solid #b3c5e5;
            text-align: center;
        }
        .pastel-header h2 {
            font-size: 1.6rem;
            font-weight: 400;
            color: #3c4858;
            margin: 0;
            letter-spacing: 0.1em;
        }
        .pastel-header .subtitle {
            font-size: 0.75rem;
            color: #7a8a9e;
            margin-top: 6px;
            letter-spacing: 0.12em;
            font-family: var(--font-en);
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-prev, .btn-index {
            background-color: #ffffff;
            color: #7a8a9e;
            border: 1px solid #d0d8e0;
        }
        .btn-prev:hover, .btn-index:hover {
            background-color: #f8fafc;
            color: #3c4858;
        }

            .interview-header h1 { font-size: 1.7rem; }
            .interview-lead { font-size: 0.95rem; }
            .question, .answer { font-size: 0.95rem; }
            .interview-meta { gap: 15px; }
