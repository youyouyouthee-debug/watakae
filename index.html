<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優 | You - Official Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@200;300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* タイムライン（年表）のデザイン */
        .timeline {
            position: relative;
            padding: 20px 0;
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
        }
        .timeline::after {
            content: '';
            position: absolute;
            width: 2px;
            background-color: #2c3e50;
            top: 0;
            bottom: 0;
            left: 20px;
            margin-left: -1px;
        }
        .timeline-item {
            padding: 0 0 30px 40px;
            position: relative;
        }
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #fff;
            border: 3px solid #d35400;
            top: 6px;
            left: 14px;
            z-index: 1;
        }
        .time-period {
            font-weight: bold;
            color: #d35400;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .timeline-title {
            font-size: 1.1rem;
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        .timeline-content {
            font-size: 0.95rem;
            color: #4f5d73;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        
        :root {
            --bg-color: #fcfbf9;
            --text-main: #242424;
            --text-sub: #5a5550;
            --accent-color: #8c7b6e;
            --band-bg: #e6e0d5;
            --light-gray: #e8e6e1;
            --font-serif: 'Noto Serif JP', serif;
            --font-en: 'Cormorant Garamond', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-serif);
            color: var(--text-main);
            background-color: var(--bg-color);
            line-height: 2.1;
            letter-spacing: 0.1em;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: rgba(252, 251, 249, 0.92);
            backdrop-filter: blur(8px);
            color: var(--text-main);
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(232, 230, 225, 0.5);
        }

        header h1 {
            font-size: 1.25rem;
            letter-spacing: 0.25em;
            font-weight: 300;
            z-index: 100;
        }

        header h1 a {
            color: var(--text-main);
            text-decoration: none;
            transition: opacity 0.4s;
        }
        
        header h1 a:hover { opacity: 0.6; }

        nav ul {
            list-style: none;
            display: flex;
            gap: 3rem;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-family: var(--font-en);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            position: relative;
            transition: color 0.4s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--accent-color);
            transition: width 0.4s ease;
        }

        nav a:hover { color: var(--accent-color); }
        nav a:hover::after { width: 100%; }

        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 100;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 1px;
            background-color: var(--text-main);
            margin: 6px 0;
            transition: all 0.4s ease;
        }

        @media (max-width: 768px) {
            .hamburger { display: block; }
            nav ul {
                position: fixed;
                top: 0;
                right: -100%;
                width: 100%;
                height: 100vh;
                background-color: rgba(252, 251, 249, 0.98);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                transition: right 0.5s cubic-bezier(0.25, 1, 0.5, 1);
                z-index: 99;
                gap: 2.5rem;
            }
            nav ul.active { right: 0; }
            nav a { font-size: 1.15rem; }
            .hamburger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
            .hamburger.active span:nth-child(2) { opacity: 0; }
            .hamburger.active span:nth-child(3) { transform: translateY(-7px) rotate(-44deg); }
        }

        .en-title {
            font-family: var(--font-en);
            font-weight: 300;
            font-style: italic;
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: block;
            letter-spacing: 0.15em;
        }

        .section-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 140px 30px;
            border-bottom: 1px solid var(--light-gray);
        }

        .animate-target {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.6s cubic-bezier(0.215, 0.610, 0.355, 1), transform 1.6s cubic-bezier(0.215, 0.610, 0.355, 1);
        }

        .animate-target.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* 1. ヒーローセクション */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle at center, #fcfbf9 0%, #f6f4ee 100%);
        }

        .hero h2 {
            font-size: 2.4rem;
            font-weight: 200;
            margin-bottom: 40px;
            letter-spacing: 0.4em;
            text-indent: 0.4em;
            color: var(--text-main);
        }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-sub);
            font-weight: 300;
            line-height: 2.2;
            max-width: 650px;
            margin: 0 auto;
            word-break: keep-all;
        }

        /* 2. インダクションセクション */
        .introduction-band {
            background-color: var(--band-bg);
            padding: 100px 0;
            border-bottom: 1px solid var(--light-gray);
        }

        .intro-grid {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 50px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .intro-grid {
                grid-template-columns: 1fr 1.2fr;
            }
        }

        .profile-img-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 16px; /* 角を丸くして荒れを目立たなく */
            background: #f0ece6;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 15%; /* 顔を綺麗に中心に */
            transform: scale(1.08); /* 少しズームして四隅の荒さをカット */
            filter: sepia(0.12) contrast(0.97) brightness(1.02);
        }

        .concept-text {
            font-size: 1.05rem;
            text-align: justify;
            color: var(--text-main);
            font-weight: 300;
        }

        .concept-text p { margin-bottom: 25px; }
        .concept-text p:last-child { margin-bottom: 0; }

        /* 3. 出版告知 */
        .book-section h3 {
            font-size: 1.6rem;
            font-weight: 300;
            margin-bottom: 60px;
            letter-spacing: 0.2em;
        }

        .book-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 60px;
            align-items: start;
        }

        @media (min-width: 768px) {
            .book-grid { grid-template-columns: 1fr 1.3fr; }
        }

        .book-cover-placeholder {
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
            aspect-ratio: 5 / 7;
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .book-cover-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .book-cover-placeholder:hover img { transform: scale(1.02); }

        .book-title {
            font-size: 1.45rem;
            font-weight: 400;
            margin-bottom: 25px;
            letter-spacing: 0.1em;
        }

        .book-meta {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 30px;
            border-left: 1px solid var(--accent-color);
            padding-left: 20px;
            line-height: 1.8;
        }

        .book-description {
            font-size: 0.95rem;
            text-align: justify;
            font-weight: 300;
        }

        .book-description p.quote-context {
            border-left: 3px solid var(--light-gray);
            padding-left: 20px;
            color: var(--text-sub);
            margin: 25px 0;
        }

        .book-description p { margin-bottom: 20px; }

        /* interview リンクバナー */
        .interview-banner-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 30px;
            border-bottom: 1px solid var(--light-gray);
        }

        .interview-banner-link {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            padding: 3.5rem 2rem;
            background: linear-gradient(135deg, #8c7b6e 0%, #6f6455 100%);
            border-radius: 8px;
            color: #ffffff !important;
            box-shadow: 0 10px 30px rgba(140, 123, 110, 0.2);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .interview-banner-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(140, 123, 110, 0.3);
        }

        .interview-banner-sub {
            font-family: var(--font-en);
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.85;
            margin-bottom: 8px;
            color: #ffffff !important;
        }

        .interview-banner-main {
            font-family: var(--font-serif);
            font-size: 1.55rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #ffffff !important;
        }

        .interview-banner-btn {
            font-size: 0.95rem;
            opacity: 0.9;
            color: #ffffff !important;
        }

        /* note バナー */
        .note-banner-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 30px 100px 30px;
            border-bottom: 1px solid var(--light-gray);
        }

        .note-banner-link {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            padding: 4.5rem 2rem;
            background: linear-gradient(135deg, #607d6b 0%, #4a6153 100%);
            border-radius: 12px;
            color: #ffffff !important;
            box-shadow: 0 12px 35px rgba(96, 125, 107, 0.15);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .note-banner-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 45px rgba(96, 125, 107, 0.3);
        }

        .note-banner-sub {
            font-family: var(--font-en);
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 10px;
            color: #ffffff !important;
        }

        .note-banner-main {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #ffffff !important;
        }

        .note-banner-btn {
            font-size: 0.95rem;
            opacity: 0.9;
            color: #ffffff !important;
        }

        /* ペルソナ（猫写真・大幅修正） */
        .persona-band {
            background-color: #f8f6f1;
            padding: 100px 0;
            border-bottom: 1px solid var(--light-gray);
        }

        .persona-grid {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 50px;
            align-items: center;
        }
